# Compatibility override for old local commands; compose.yaml already starts the current app.
# Does not create a second API or migrate the DB.
services:
  api:
    image: lostparty-backend-api:two-cycle
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers
      - --no-access-log
      - --log-config
      - app/core/logging.json
