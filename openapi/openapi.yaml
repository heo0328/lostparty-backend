  "components": {
    "schemas": {
      "ChallengeIn": {
        "properties": {
          "transaction_secret_hash": {
            "type": "string",
            "maxLength": 64,
            "minLength": 64,
            "pattern": "^[0-9a-f]{64}$",
            "title": "Transaction Secret Hash"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "transaction_secret_hash"
        ],
        "title": "ChallengeIn"
      },
      "ChallengeOut": {
        "properties": {
          "transaction_id": {
            "type": "string",
            "format": "uuid",
            "title": "Transaction Id"
          },
          "nonce": {
            "type": "string",
            "maxLength": 43,
            "minLength": 43,
            "pattern": "^[A-Za-z0-9_-]{43}$",
            "title": "Nonce"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time",
            "title": "Expires At"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "transaction_id",
          "nonce",
          "expires_at"
        ],
        "title": "ChallengeOut"
      },
      "ErrorDetail": {
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "INVALID_REQUEST",
              "AUTH_TRANSACTION_INVALID",
              "AUTH_TRANSACTION_EXPIRED",
              "AUTH_TRANSACTION_CONSUMED",
              "GOOGLE_PROOF_INVALID",
              "AUTH_PROVIDER_UNAVAILABLE",
              "ACCESS_INVALID",
              "ACCESS_EXPIRED",
              "SESSION_EXPIRED",
              "SESSION_REVOKED",
              "ACCOUNT_DISABLED",
              "REFRESH_INVALID",
              "REFRESH_EXPIRED",
              "REFRESH_REUSED",
              "REFRESH_RECOVERY_EXPIRED",
              "REFRESH_RECOVERY_LIMITED",
              "REFRESH_RESULT_SUPERSEDED",
              "RATE_LIMITED",
              "SERVICE_UNAVAILABLE"
            ],
            "title": "Code"
          },
          "message": {
            "type": "string",
            "title": "Message"
          },
          "request_id": {
            "type": "string",
            "format": "uuid",
            "title": "Request Id"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "code",
          "message",
          "request_id"
        ],
        "title": "ErrorDetail"
      },
      "ErrorOut": {
        "properties": {
          "error": {
            "$ref": "#/components/schemas/ErrorDetail"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "error"
        ],
        "title": "ErrorOut"
      },
      "GoogleIn": {
        "properties": {
          "transaction_id": {
            "type": "string",
            "format": "uuid",
            "title": "Transaction Id"
          },
          "transaction_secret": {
            "type": "string",
            "maxLength": 43,
            "minLength": 43,
            "pattern": "^[A-Za-z0-9_-]{43}$",
            "title": "Transaction Secret"
          },
          "google_id_token": {
            "type": "string",
            "maxLength": 16384,
            "minLength": 1,
            "title": "Google Id Token"
          },
          "remember_me": {
            "type": "boolean",
            "title": "Remember Me"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "transaction_id",
          "transaction_secret",
          "google_id_token",
          "remember_me"
        ],
        "title": "GoogleIn"
      },
      "HealthResponse": {
        "properties": {
          "status": {
            "type": "string",
            "const": "ok",
            "title": "Status"
          },
          "database": {
            "type": "string",
            "const": "ok",
            "title": "Database"
          }
        },
        "type": "object",
        "required": [
          "status",
          "database"
        ],
        "title": "HealthResponse"
      },
      "LoginOut": {
        "properties": {
          "token_type": {
            "type": "string",
            "const": "Bearer",
            "title": "Token Type"
          },
          "access_token": {
            "type": "string",
            "maxLength": 16384,
            "minLength": 1,
            "title": "Access Token"
          },
          "access_expires_at": {
            "type": "string",
            "format": "date-time",
            "title": "Access Expires At"
          },
          "refresh_token": {
            "type": "string",
            "maxLength": 43,
            "minLength": 43,
            "pattern": "^[A-Za-z0-9_-]{43}$",
            "title": "Refresh Token"
          },
          "refresh_expires_at": {
            "type": "string",
            "format": "date-time",
            "title": "Refresh Expires At"
          },
          "session": {
            "$ref": "#/components/schemas/SessionOut"
          },
          "user": {
            "$ref": "#/components/schemas/UserOut"
          },
          "is_new_user": {
            "type": "boolean",
            "title": "Is New User"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "token_type",
          "access_token",
          "access_expires_at",
          "refresh_token",
          "refresh_expires_at",
          "session",
          "user",
          "is_new_user"
        ],
        "title": "LoginOut"
      },
      "LogoutIn": {
        "properties": {
          "refresh_token": {
            "type": "string",
            "maxLength": 43,
            "minLength": 43,
            "pattern": "^[A-Za-z0-9_-]{43}$",
            "title": "Refresh Token"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "refresh_token"
        ],
