name: Backend release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: backend-release-production
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      shards: ${{ steps.plan.outputs.shards }}
      deployment_mode: ${{ steps.deployment.outputs.deployment_mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source (manual runs validate only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment/release.py validate
      - name: Resolve release validation plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment/validation.py prepare
      - name: Resolve explicit deployment boundary
        id: deployment
        run: python3 scripts/deployment/deployment_plan.py
      - run: python3 scripts/verify_isolated.py static
      - run: python3 scripts/deployment/docker_smoke.py
        if: steps.plan.outputs.mode == 'full'
      - run: python3 scripts/deployment/web_smoke.py --synthetic
        if: steps.plan.outputs.mode == 'full'
      - run: python3 scripts/verify_isolated.py contracts
        if: steps.plan.outputs.mode != 'reuse'
      - name: Manual image build, no publication or deployment
        if: github.event_name == 'workflow_dispatch'
        run: docker build --platform linux/amd64 -t lostparty-validation:${GITHUB_SHA} .
  regression:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.verify.outputs.shards) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run regression or verify approved reuse provenance
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment/validation.py regress --index "$SHARD_INDEX"
  validation:
    if: ${{ always() && !cancelled() }}
    needs: [verify, regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact: ${{ steps.record.outputs.artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful chosen checks and record evidence
        id: record
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment/validation.py record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: dist/validation.json
          if-no-files-found: error
          retention-days: 30
  publish:
    if: ${{ github.event_name == 'push' && needs.validation.result == 'success' }}
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.validation.outputs.artifact }}
          path: dist
      - name: Registry login
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish or reuse fixed image and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment/release.py publish
      - name: Remove runner registry credentials
        if: always()
        run: docker logout ghcr.io
  deploy:
    if: ${{ needs.verify.outputs.deployment_mode == 'standard' }}
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://lostparty.duckdns.org
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read immutable release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment/release.py download
      - name: Deploy over restricted deployment SSH
        env:
          LIGHTSAIL_DEPLOY_SSH_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_SSH_KEY }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: python3 scripts/deployment/transport.py
