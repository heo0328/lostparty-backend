# Standalone: never combine with the local compose.yaml or test overrides.
name: lostparty-lightsail
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
services:
  db:
    image: postgres:17-bookworm
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-app-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt: [no-new-privileges:true]
    logging: *logging
  api:
    build: .
    image: lostparty-backend-api:${RELEASE_TAG:?Set RELEASE_TAG to the source commit}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_AZP_ALLOWLIST: ${GOOGLE_AZP_ALLOWLIST:-}
      JWT_KEY_ID: lightsail-1
      RECOVERY_KEY_ID: lightsail-1
      LOSTARK_CREDENTIAL_KEY_ID: lightsail-1
    command:
      - uvicorn
      - app.main:create_two_cycle_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.30.85.2
      - --no-access-log
      - --log-config
      - app/core/logging.json
    volumes:
      - ./.secrets/lightsail:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    logging: *logging
  caddy:
    image: caddy:2-alpine
    platform: linux/amd64
    profiles: [public]
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile.lightsail:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.85.2
    depends_on:
      api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    logging: *logging
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.85.0/24
          # Keep dynamic DB/API allocation away from Caddy's fixed .2 address,
          # including when DB/API start before the public profile is enabled.
          ip_range: 172.30.85.128/25
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
